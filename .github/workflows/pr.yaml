name: Pull Request
on: pull_request
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        args: --timeout 3m --verbose
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - run: go build -v ./...
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    # The repo tests shell out to git; make its behavior identical on the
    # Windows runner, which defaults to autocrlf=true.
    - name: Configure git
      run: |
        git config --global core.autocrlf false
        git config --global init.defaultBranch main
        git config --global user.email "ci@example.com"
        git config --global user.name "CI"
    - run: go test -v ./...
    - run: go vet ./...
  windows-e2e:
    name: Windows end-to-end
    runs-on: windows-latest
    # Exercises the real kusari.exe in a native PowerShell session. The `test`
    # matrix proves the packages compile and pass on Windows; this proves the
    # shipped binary actually works there -- it downloads and runs Waybill,
    # builds a scan bundle, and drives the auth-free commands end to end.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'

    - name: Environment
      shell: powershell
      run: |
        Write-Output "Running on Windows!"
        Get-ComputerInfo | Select-Object WindowsProductName, OsVersion
        git --version
        go version

    - name: Build kusari.exe
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        go build -o kusari.exe ./kusari
        if (-not (Test-Path kusari.exe)) { throw "kusari.exe was not produced" }
        Get-Item kusari.exe | Select-Object Name, Length

    - name: CLI starts and reports version
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        .\kusari.exe --version
        .\kusari.exe --help
        if ($LASTEXITCODE -ne 0) { throw "kusari --help exited $LASTEXITCODE" }

    # The scan bundle is built entirely on the user's machine: metadata, git
    # diff, tar and bzip2. This is the code path that used to shell out to
    # sh/tar/bzip2 and could not run on Windows at all.
    - name: Scan bundle pipeline (tar + bzip2 + diff + metadata)
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        go test ./pkg/repo/ -run "TestBundle|TestPackageDirectory|TestGitAvailable" -v
        if ($LASTEXITCODE -ne 0) { throw "bundle pipeline tests failed" }

    # A path with a space is the Windows norm (C:\Program Files, C:\Users\First
    # Last) and is exactly where quoting and path-joining bugs surface.
    - name: Scan bundle from a path containing spaces
      shell: powershell
      run: |
        # Deliberately not "Stop": these steps capture native stderr with 2>&1,
        # which Windows PowerShell surfaces as ErrorRecords. Under "Stop" the
        # first stderr line from git or kusari would abort the step. Exit codes
        # are checked explicitly instead.
        $ErrorActionPreference = "Continue"
        $repo = Join-Path $env:RUNNER_TEMP "kusari e2e repo"
        New-Item -ItemType Directory -Force -Path $repo | Out-Null
        Push-Location $repo
        git init --initial-branch=main 2>&1 | Out-Null
        git config user.email "ci@example.com"
        git config user.name "CI"
        # The Git for Windows default, so the bundle is built the way a real
        # user's machine builds it.
        git config core.autocrlf true
        New-Item -ItemType Directory -Force -Path "sub dir" | Out-Null
        Set-Content -Path "main.go" -Value "package main`n`nfunc main() {}"
        Set-Content -Path "sub dir\lib.go" -Value "package lib"
        git add -A
        git commit -q -m "initial"
        if ($LASTEXITCODE -ne 0) { throw "failed to create the test repository" }
        # Uncommitted work for the diff scan to pick up.
        Set-Content -Path "main.go" -Value "package main`n`nfunc main() { println(1) }"
        Set-Content -Path "added.go" -Value "package main"
        Pop-Location

        # repo scan requires credentials, so it cannot complete in CI. Assert it
        # reaches the auth gate rather than dying earlier on a Windows-specific
        # filesystem or shell-out failure -- the original bug report was a crash
        # in this command before it ever got this far.
        $out = .\kusari.exe repo scan "$repo" HEAD 2>&1 | Out-String
        Write-Output $out
        if ($out -match "failed to package directory" -or
            $out -match "Cannot create a file when that file already exists" -or
            $out -match "error taring source code" -or
            $out -match "error compressing file" -or
            $out -match "'sh' is not recognized" -or
            $out -match "'tar' is not recognized" -or
            $out -match "'bzip2' is not recognized") {
          throw "repo scan failed inside the local packaging pipeline: $out"
        }
        if ($out -notmatch "auth" -and $out -notmatch "token" -and $out -notmatch "login") {
          throw "expected repo scan to stop at authentication, got: $out"
        }
        Write-Output "repo scan reached the auth gate as expected"

    # Downloads the Windows release zip, verifies its SHA256, unpacks
    # waybill.exe and runs it. Exercises the whole lazy-install path natively.
    - name: Generate an SBOM
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        .\kusari.exe platform generate -- --path .
        if ($LASTEXITCODE -ne 0) { throw "platform generate exited $LASTEXITCODE" }
        if (-not (Test-Path project.cdx.json)) { throw "SBOM was not written" }
        $sbom = Get-Content project.cdx.json -Raw | ConvertFrom-Json
        Write-Output "SBOM format=$($sbom.bomFormat) components=$($sbom.components.Count)"
        if ($sbom.bomFormat -ne "CycloneDX") { throw "unexpected bomFormat: $($sbom.bomFormat)" }
        if ($sbom.components.Count -lt 1) { throw "SBOM contains no components" }

    - name: Waybill installed as a Windows executable
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $bin = Get-ChildItem -Path (Join-Path $env:USERPROFILE ".kusari\bin") -Filter "waybill-*.exe"
        if (-not $bin) { throw "no waybill-*.exe in ~/.kusari/bin" }
        $bin | Select-Object Name, Length
        # Second call must hit the cache instead of downloading again.
        .\kusari.exe platform generate -- --path . --output cached.cdx.json
        if ($LASTEXITCODE -ne 0) { throw "cached waybill run exited $LASTEXITCODE" }
        if (-not (Test-Path cached.cdx.json)) { throw "cached run wrote no SBOM" }

    - name: Connectivity preflight
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"
        # Runner egress can legitimately vary, so a failing probe is reported
        # rather than fatal here. What this step guards against is the binary
        # crashing or hanging, and a report that never gets written.
        .\kusari.exe connectivity check --timeout 30s --report preflight.json
        Write-Output "connectivity check exited $LASTEXITCODE"
        if (-not (Test-Path preflight.json)) { throw "no preflight report written" }
        $report = Get-Content preflight.json -Raw | ConvertFrom-Json
        $report.tests | Select-Object name, status, category, statusCode | Format-Table
        if ($report.tests.Count -lt 1) { throw "preflight report contains no probes" }

    # Winsock returns WSAE* error numbers that do not equal the POSIX syscall.E*
    # constants, so a diagnosis keyed on the POSIX names alone silently degrades
    # to a generic message on Windows. Point a probe at a closed local port to
    # force a refused connection and assert it is named as one -- this needs no
    # external network, so it is deterministic on any runner.
    - name: Refused connections are diagnosed, not swallowed
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"
        $out = .\kusari.exe connectivity check --timeout 10s --platform-url http://127.0.0.1:1 2>&1 | Out-String
        Write-Output $out
        # A failing probe makes the command exit 1; that is expected here.
        if ($out -notmatch "actively refused the connection") {
          throw "a refused connection was not classified as one on Windows; got: $out"
        }
        Write-Output "connection refused was correctly diagnosed"

    - name: MCP client config paths resolve
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        # Expands %APPDATA% / %USERPROFILE% in the client table.
        .\kusari.exe ai list
        if ($LASTEXITCODE -ne 0) { throw "ai list exited $LASTEXITCODE" }
  dependency-review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  up-to-date:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - run: find -name \*.go | xargs gofmt -w
    - run: go mod tidy
    - run: git diff
    - run: git status -s && test -z "$(git status -s)"
